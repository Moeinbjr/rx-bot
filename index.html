<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Moein Baghjari | توسعه دهنده وب</title>
<link rel="icon" type="image/png" href="Images/title.png">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

<style>
/* استایل‌های اصلی و حرفه‌ای معین */
:root { --bg: #ffffff; --text: #1a1a1a; --accent: #4f46e5; --card-bg: rgba(245, 245, 250, 0.8); --border: rgba(0, 0, 0, 0.1); --glow: rgba(79, 70, 229, 0.2); }
body.dark { --bg: #050505; --text: #ffffff; --accent: #818cf8; --card-bg: rgba(20, 20, 25, 0.8); --border: rgba(255, 255, 255, 0.1); --glow: rgba(129, 140, 248, 0.2); }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
html, body { width: 100%; direction: rtl; background: var(--bg); color: var(--text); transition: background 0.4s; overflow-x: hidden; }

.nav-bar { position: fixed; top: 0; width: 100%; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 7%; z-index: 4000; transition: 0.3s; }
.nav-bar.scrolled { background: var(--card-bg); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); }

.menu-btn { width: 30px; height: 16px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; z-index: 5000; position: relative; }
.menu-btn span { height: 2px; background: var(--text); border-radius: 4px; transition: 0.4s; }
body.menu-open .menu-btn #l1 { transform: translateY(7px) rotate(45deg); }
body.menu-open .menu-btn #l2 { transform: translateY(-7px) rotate(-45deg); width: 100%; }

#menu-layer { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: flex; align-items: center; justify-content: center; clip-path: circle(0% at 92% 5%); transition: 0.8s cubic-bezier(0.77, 0, 0.175, 1); }
body.menu-open #menu-layer { clip-path: circle(150% at 92% 5%); }
.menu-links { list-style: none; width: 85%; max-width: 450px; }
.menu-links li { margin-bottom: 15px; }
.menu-links a { display: block; padding: 20px; text-align: center; border: 2px solid var(--border); border-radius: 25px; color: var(--text); text-decoration: none; font-size: 1.4rem; font-weight: 800; background: var(--card-bg); transition: 0.3s; }
.menu-links a:hover { border-color: var(--accent); color: var(--accent); }

.hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 7%; }
.hero-title { font-size: clamp(3rem, 12vw, 8rem); font-weight: 900; line-height: 1.1; }
.hero-title span { background: linear-gradient(90deg, var(--accent), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.main-btn { padding: 18px 50px; background: var(--accent); color: white; border-radius: 100px; text-decoration: none; font-weight: 700; box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4); border: none; cursor: pointer; transition: 0.3s; display: inline-block; }
.main-btn:hover { transform: translateY(-3px); }

.glass-card { background: var(--card-bg); padding: 40px; border-radius: 40px; border: 1px solid var(--border); backdrop-filter: blur(15px); max-width: 900px; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
.modern-input { width: 100%; padding: 18px; border-radius: 18px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; margin-bottom: 15px; font-size: 1rem; transition: 0.3s; }
.modern-input:focus { border-color: var(--accent); }

.section { display: none; padding: 120px 7% 60px; min-height: 100vh; }
.section.active { display: block; animation: slideIn 0.6s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.gift-trigger { position: fixed; bottom: 20px; left: 20px; width: 55px; height: 55px; background: var(--accent); border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2500; box-shadow: 0 10px 25px var(--glow); animation: floating 3s infinite; }
@keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>
</head>
<body class="dark">

<nav class="nav-bar" id="navbar">
  <div class="menu-btn" onclick="toggleMenu()">
      <span id="l1" style="width: 100%;"></span>
      <span id="l2" style="width: 65%;"></span>
  </div>
  <b style="font-size: 1.3rem; color: var(--accent); letter-spacing: 1px;">MOEIN BAGHJARI</b>
</nav>

<div id="menu-layer">
  <ul class="menu-links">
    <li><a href="#" onclick="go('home')">صفحه اصلی</a></li>
    <li><a href="#" onclick="go('order')">ثبت سفارش</a></li>
    <li><a href="#" id="loginMenuLink" onclick="go('auth')">ورود / حساب کاربری</a></li>
  </ul>
</div>

<div id="app">
  <section id="home" class="section active" style="padding:0;">
    <div class="hero">
        <div>
            <h1 class="hero-title">MOEIN<br><span>PROJECTS</span></h1>
            <p style="margin: 25px 0; opacity: 0.7; font-size: 1.2rem;">ایده‌های شما را به تجربه‌های دیجیتال تبدیل می‌کنم.</p>
            <a href="#" onclick="go('order')" class="main-btn">شروع پروژه جدید</a>
        </div>
    </div>
  </section>

  <section id="auth" class="section">
    <h2 id="authTitle" style="text-align: center; margin-bottom: 30px; font-weight: 900; font-size: 2.2rem;">ورود به حساب</h2>
    <div class="glass-card" style="max-width: 420px;">
        <input type="email" id="authEmail" class="modern-input" placeholder="ایمیل شما (مثال: moein@test.com)">
        <input type="password" id="authPassword" class="modern-input" placeholder="رمز عبور (حداقل ۶ کاراکتر)">
        <button onclick="handleAuth()" id="authBtn" class="main-btn" style="width: 100%; font-size: 1.1rem;">ورود</button>
        <p onclick="toggleAuthMode()" id="authToggle" style="text-align: center; margin-top: 25px; cursor: pointer; opacity: 0.8; font-size: 0.95rem;">حساب ندارید؟ ثبت‌نام کنید</p>
    </div>
  </section>

  <section id="order" class="section">
    <h2 style="text-align: center; margin-bottom: 40px; font-weight: 900; font-size: 2.2rem;">جزئیات سفارش پروژه</h2>
    <div class="glass-card">
      <form id="orderForm">
        <input type="tel" name="phone" class="modern-input" placeholder="شماره تماس شما" required>
        <textarea name="details" class="modern-input" rows="5" placeholder="در مورد پروژه خود کمی توضیح دهید..." required></textarea>
        <button type="submit" class="main-btn" style="width: 100%;">ثبت نهایی و ارسال</button>
      </form>
    </div>
  </section>
</div>

<div class="gift-trigger" onclick="alert('تخفیف ۳۰ درصدی برای اولین سفارش شما!')">🎁</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

<script>
// ۱. تنظیمات فایربیس اختصاصی معین با دقت کامل
const firebaseConfig = {
  apiKey: "AIzaSyCFhWUIQGfRf328geHbTA3AmwD0YeuQkHg",
  authDomain: "moein-app.firebaseapp.com",
  projectId: "moein-app",
  storageBucket: "moein-app.firebasestorage.app",
  messagingSenderId: "391382939606",
  appId: "1:391382939606:web:eaae34a512c5bd54fa5677"
};

// ۲. مقداردهی اولیه فایربیس
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ۳. عملکردهای ظاهر سایت
function toggleMenu() { document.body.classList.toggle('menu-open'); }

function go(id) {
    document.body.classList.remove('menu-open');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(id);
    if(target) target.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('scroll', () => {
    const nav = document.getElementById('navbar');
    if (window.pageYOffset > 50) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
});

// ۴. مدیریت ورود و ثبت‌نام (Auth)
let isLoginMode = true;
function toggleAuthMode() {
    isLoginMode = !isLoginMode;
    document.getElementById('authTitle').innerText = isLoginMode ? 'ورود به حساب' : 'ساخت حساب جدید';
    document.getElementById('authBtn').innerText = isLoginMode ? 'ورود' : 'ثبت نام';
    document.getElementById('authToggle').innerText = isLoginMode ? 'حساب ندارید؟ ثبت‌نام کنید' : 'حساب دارید؟ وارد شوید';
}

async function handleAuth() {
    const email = document.getElementById('authEmail').value;
    const pass = document.getElementById('authPassword').value;
    
    if(!email || !pass) { alert("ایمیل و رمز عبور را وارد کن رفیق!"); return; }

    try {
        if (isLoginMode) {
            await auth.signInWithEmailAndPassword(email, pass);
            alert("خوش آمدی!");
        } else {
            await auth.createUserWithEmailAndPassword(email, pass);
            alert("حساب کاربری شما با موفقیت ساخته شد.");
        }
        go('home');
    } catch (error) {
        let msg = "خطا رخ داد!";
        if(error.code === "auth/weak-password") msg = "رمز عبور باید حداقل ۶ رقم باشد.";
        if(error.code === "auth/email-already-in-use") msg = "این ایمیل قبلاً ثبت شده است.";
        if(error.code === "auth/user-not-found") msg = "کاربری با این ایمیل پیدا نشد.";
        alert(msg + "\n" + error.message);
    }
}

// ۵. شنود وضعیت لاگین برای تغییر منو
auth.onAuthStateChanged(user => {
    const link = document.getElementById('loginMenuLink');
    if (user) {
        link.innerText = "خروج (" + user.email.split('@')[0] + ")";
        link.onclick = (e) => { e.preventDefault(); auth.signOut(); };
    } else {
        link.innerText = "ورود / حساب کاربری";
        link.onclick = (e) => { e.preventDefault(); go('auth'); };
    }
});

// ۶. ثبت سفارش
document.getElementById('orderForm').onsubmit = function(e) {
    e.preventDefault();
    if(!auth.currentUser) {
        alert("معین جان، برای ثبت سفارش اول باید وارد حسابت بشی.");
        go('auth');
        return;
    }
    alert("سفارش شما با موفقیت در دیتابیس ثبت شد. به زودی با شما تماس می‌گیریم.");
    this.reset();
};
</script>
</body>
</html>
